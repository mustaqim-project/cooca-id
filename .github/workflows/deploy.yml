name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # Never cancel an in-progress deployment

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Run Tests & Code Quality
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cooca_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, intl, zip, gd
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock") }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 🔧 Install PHP dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      - name: 🔑 Setup .env for testing
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=cooca_id/DB_DATABASE=cooca_test/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=root/' .env
          php artisan key:generate

      - name: 🗃️ Run migrations
        run: php artisan migrate --force

      - name: ✅ Run PHPUnit tests
        run: php artisan test --parallel

  # ──────────────────────────────────────────────────────────
  # JOB 2: Build Frontend Assets
  # ──────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Frontend Assets
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Node dependencies
        run: npm ci --ignore-scripts

      - name: 🏗️ Build production assets
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # JOB 3: Deploy to Server
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [test, build]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: 🔑 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Upload build to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/build/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/

      - name: 🚀 Execute deployment script
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash ${{ secrets.DEPLOY_PATH }}/scripts/deploy.sh"

      - name: 🔔 Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.environment || 'production' }} succeeded!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: 🚨 Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to ${{ github.event.inputs.environment || 'production' }} FAILED!"
          echo "Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

# ──────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS:
# DEPLOY_SSH_PRIVATE_KEY  - Private SSH key for server access
# DEPLOY_HOST             - Server hostname or IP address
# DEPLOY_USER             - SSH username (e.g., ubuntu, deploy)
# DEPLOY_PATH             - Absolute path to app on server (e.g., /var/www/cooca-id)
# ──────────────────────────────────────────────────────────
